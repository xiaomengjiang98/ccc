# PaperMod Starter — a ready-to-run Hugo site.
baseURL: "https://ccc.xiaomengjiang98.workers.dev/"
title: "我的个人博客"
theme: [PaperMod, hugo-shortcode-gallery]

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
defaultContentLanguage: zh
hasCJKLanguage: true

minify:
  disableXML: true
  minifyOutput: true
  tdewolff:
    html:
      keepDocumentTags: true
      keepEndTags: true
      keepQuotes: true
    css:
      precision: 2
    js:
      precision: 2

permalinks:
  page:
    posts: /posts/:year/:month/:day/:contentbasename/

pagination:
  disableAliases: false
  pagerSize: 5

languages:
  zh:
    languageName: "中文"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: 文章
          url: posts/
          weight: 1
        - name: 归档
          url: archives/
          weight: 2
        - name: 分类
          url: categories/
          weight: 3
        - name: 搜索
          url: search/
          weight: 4
        - name: 关于
          url: about/
          weight: 5

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: "这是我的个人博客，记录生活与技术笔记。"
  author: "博主"
  hideAuthor: false

  schema:
    publisherType: Person

  mainSections: ["posts"]
  defaultTheme: auto
  ShowShareButtons: false
  ShowReadingTime: true
  ShowWordCount: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: false
  ShowPageNums: true
  ShowToc: true
  DateFormat: "2006-01-02"
  ShowFullTextinRSS: true
  comments: false
  hideSummary: false
  languageCode: zh

  homeInfoParams:
    Title: "你好，欢迎来到我的博客！ 👋"
    Content: "这里记录我的生活、思考与日常随笔。"
    moreText: "查看更多文章"
    moreLink: "posts/"

  socialIcons:
    - name: rss
      title: RSS 订阅
      url: "/index.xml"

  extendHead:
    preloadFont: "/fonts/inter-7.woff2"

  assets:
    disableHLJS: true
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"

  cover:
    hiddenInList: false
    hiddenInSingle: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    guessSyntax: true
